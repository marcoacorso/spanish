<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graded Readers Español</title>
<meta name="description" content="Graded readers com áudio, offline.">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Español">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<div class="player" id="player" hidden><div class="wrap">
  <button class="pbtn" id="pPrev" aria-label="Frase anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="pbtn main" id="pPlay" aria-label="Tocar"><svg viewBox="0 0 24 24" fill="currentColor" id="icPlay"><path d="M7 4v16l13-8z"/></svg></button>
  <button class="pbtn" id="pNext" aria-label="Frase seguinte"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  <button class="pbtn" id="pLoop" aria-label="Repetir frase" title="Repetir a frase atual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
  <div class="prog"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Posição"><span id="tDur">0:00</span></div>
  <button class="speed" id="pSpeed" title="Velocidade">1×</button>
</div></div>

<div id="pop" role="tooltip"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" multiple hidden>
<audio id="au" preload="auto"></audio>
<script src="creator.js"></script>
<script src="app.js"></script>
</body>
</html>
